<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة التحكم | p2p‑x</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<div class="bg-blue-900 text-white p-6 shadow flex justify-between items-center">
  <div>
    <h1 class="text-2xl font-bold">لوحة التحكم الرسمية — p2p‑x</h1>
    <p class="text-sm opacity-80">مراقبة العمليات، AML، الاحتيال، السيولة.</p>
  </div>
  <div class="text-xs">
    <span id="admin_user">مسؤول</span>
  </div>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 p-6">

  <div class="bg-white p-4 rounded shadow">
    <h2 class="text-lg font-bold mb-3">📜 آخر عمليات Swap</h2>
    <table id="ops_table" class="w-full text-sm border border-gray-300"></table>
  </div>

  <div class="bg-white p-4 rounded shadow">
    <h2 class="text-lg font-bold mb-3">⚠️ إنذارات AML / Fraud</h2>
    <table id="aml_table" class="w-full text-sm border border-gray-300"></table>
  </div>

  <div class="bg-white p-4 rounded shadow">
    <h2 class="text-lg font-bold mb-3">💧 حالة السيولة</h2>
    <table id="liq_table" class="w-full text-sm border border-gray-300"></table>
  </div>

</div>

<script>
const ADMIN_TOKEN = localStorage.getItem("admin_token"); // يجب أن يكون JWT من backend

if (!ADMIN_TOKEN) {
  alert("غير مصرح لك بالدخول إلى لوحة التحكم.");
  location.href = "/";
}

async function loadTable(endpoint, elementId, columns) {
  const res = await fetch(endpoint, {
    headers: { "Authorization": `Bearer ${ADMIN_TOKEN}` }
  });
  if (!res.ok) {
    document.getElementById(elementId).innerHTML = "<tr><td class='p-2'>خطأ في التحميل أو غير مصرح</td></tr>";
    return;
  }
  const data = await res.json();
  let html = "<tr class='bg-gray-200'>";
  columns.forEach(c => html += `<th class='border p-2'>${c}</th>`);
  html += "</tr>";
  data.forEach(row => {
    html += "<tr>";
    columns.forEach(c => html += `<td class='border p-2'>${row[c]}</td>`);
    html += "</tr>";
  });
  document.getElementById(elementId).innerHTML = html;
}

loadTable("/admin/operations", "ops_table",
  ["user_id","src_network","dst_network","src_token","dst_token","amount","chosen_protocol","created_at"]);

loadTable("/admin/alerts", "aml_table",
  ["user_id","type","details","score","created_at"]);

loadTable("/admin/liquidity", "liq_table",
  ["asset","balance","min_required","id"]);

</script>

</body>
</html>
