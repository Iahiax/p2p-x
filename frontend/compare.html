<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>مقارنة أسعار البروتوكولات | p2p‑x</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { font-family: Tahoma; direction:rtl; background:#f0f2f5; margin:0; padding:20px; }
  .card { background:#fff; padding:20px; border-radius:8px; border:1px solid #d0d4da; margin-bottom:20px; }
  label { display:block; margin-top:10px; }
  input { width:100%; padding:10px; margin-top:4px; border:1px solid #ccc; border-radius:4px; }
  button { padding:10px 16px; margin-top:12px; background:#0057b8; color:#fff; border:none; border-radius:4px; cursor:pointer; }
  table { width:100%; border-collapse:collapse; margin-top:20px; }
  th, td { border:1px solid #ccc; padding:10px; font-size:13px; }
</style>
</head>
<body>

<div class="card">
  <h2>📊 مقارنة أسعار البروتوكولات</h2>

  <label>شبكة من</label><input id="src_network" value="Ethereum">
  <label>شبكة إلى</label><input id="dst_network" value="Arbitrum">
  <label>عملة من</label><input id="src_token" value="USDT">
  <label>عملة إلى</label><input id="dst_token" value="USDC">
  <label>الكمية</label><input id="amount" type="number" value="100">

  <button onclick="compare()">عرض المقارنة</button>
</div>

<div class="card">
  <canvas id="chart" height="120"></canvas>
</div>

<div class="card">
  <table id="compare_table"></table>
</div>

<script>
async function compare() {
  const p = new URLSearchParams({
    src_network: src_network.value,
    dst_network: dst_network.value,
    src_token: src_token.value,
    dst_token: dst_token.value,
    amount: amount.value
  });

  const res = await fetch(`/compare?${p}`);
  const data = await res.json();

  const labels = data.all.map(r => r.protocol);
  const values = data.all.map(r => r.final_amount);

  new Chart(document.getElementById('chart'), {
    type: 'bar',
    data: { labels, datasets: [{ label: 'القيمة النهائية', data: values, backgroundColor:'#0057b8' }] },
    options: { responsive:true, plugins:{legend:{display:false}} }
  });

  let html = "<tr><th>البروتوكول</th><th>القيمة النهائية</th><th>الرسوم</th><th>الوقت</th></tr>";
  data.all.forEach(r => {
    html += `<tr>
      <td>${r.protocol}</td>
      <td>${r.final_amount}</td>
      <td>${r.fee}</td>
      <td>${r.eta_seconds} ثانية</td>
    </tr>`;
  });
  compare_table.innerHTML = html;
}
</script>

</body>
</html>
