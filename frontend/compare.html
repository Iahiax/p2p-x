<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مقارنة أسعار البروتوكولات | p2p‑x</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-gray-100">

<div class="p-4 bg-blue-900 text-white">
  <h1 class="text-xl font-bold">📊 مقارنة أسعار البروتوكولات</h1>
  <p class="text-xs opacity-80">عرض أفضل الأسعار بين البروتوكولات مع رسوم بيانية.</p>
</div>

<div class="p-4 max-w-xl mx-auto bg-white rounded shadow mt-4">

  <label class="block text-sm mb-1">شبكة من</label>
  <input id="src_network" class="w-full border rounded px-2 py-1 mb-2" value="Ethereum">

  <label class="block text-sm mb-1">شبكة إلى</label>
  <input id="dst_network" class="w-full border rounded px-2 py-1 mb-2" value="Arbitrum">

  <label class="block text-sm mb-1">عملة من</label>
  <input id="src_token" class="w-full border rounded px-2 py-1 mb-2" value="USDT">

  <label class="block text-sm mb-1">عملة إلى</label>
  <input id="dst_token" class="w-full border rounded px-2 py-1 mb-2" value="USDC">

  <label class="block text-sm mb-1">الكمية</label>
  <input id="amount" type="number" class="w-full border rounded px-2 py-1 mb-4" value="100">

  <button onclick="compare()" class="bg-blue-600 text-white px-4 py-2 rounded text-sm">
    عرض المقارنة
  </button>

</div>

<div class="p-4 max-w-3xl mx-auto bg-white rounded shadow mt-4">
  <canvas id="chart" height="120"></canvas>
</div>

<div class="p-4 max-w-3xl mx-auto bg-white rounded shadow mt-4">
  <table id="compare_table" class="w-full text-sm border border-gray-300"></table>
</div>

<script>
async function compare() {
  const p = new URLSearchParams({
    src_network: src_network.value,
    dst_network: dst_network.value,
    src_token: src_token.value,
    dst_token: dst_token.value,
    amount: amount.value
  });

  const res = await fetch(`/compare?${p}`);
  const data = await res.json();

  const labels = data.all.map(r => r.protocol);
  const values = data.all.map(r => r.final_amount);

  new Chart(document.getElementById('chart'), {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: 'القيمة النهائية',
        data: values,
        backgroundColor: '#0057b8'
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } }
    }
  });

  let html = "<tr class='bg-gray-200'><th class='border p-2'>البروتوكول</th><th class='border p-2'>القيمة النهائية</th><th class='border p-2'>الرسوم</th><th class='border p-2'>الوقت</th></tr>";
  data.all.forEach(r => {
    html += `<tr>
      <td class='border p-2'>${r.protocol}</td>
      <td class='border p-2'>${r.final_amount}</td>
      <td class='border p-2'>${r.fee}</td>
      <td class='border p-2'>${r.eta_seconds} ثانية</td>
    </tr>`;
  });
  compare_table.innerHTML = html;
}
</script>

</body>
</html>
